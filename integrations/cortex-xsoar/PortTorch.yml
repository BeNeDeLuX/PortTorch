commonfields:
  id: PortTorch
  version: -1
name: PortTorch
display: PortTorch
category: Vulnerability Management
description: Query and drive PortTorch, an internal network reconnaissance platform - look hosts up with their open ports, service fingerprints and correlated CVEs, queue rescans and ad-hoc scans, stop a running scan, and record triage decisions so a handled finding stops resurfacing.
detaileddescription: "## PortTorch\n\nPortTorch is an internal, Shodan-style network reconnaissance platform: Go scanners\nrun masscan -> nmap -> gowitness/nuclei against your own networks and ship results to\na central webserver with a dashboard and a PostgreSQL database.\n\nThis integration speaks PortTorch's **external API** (`/api/v1`), which is the whole of\nwhat an API token can reach. The dashboard's own `/api/*` routes are session\nauthenticated and the scanner ingest API is a private scanner-to-webserver protocol;\nneither is reachable with a token, and neither is a stable contract.\n\n### Setup\n\n1. In PortTorch, sign in as an admin and open **Admin -> API Tokens**.\n2. Create a token. The plaintext value is shown **once**, at creation - copy it now.\n   - Scope **read** is enough for `porttorch-list-hosts` and `porttorch-get-host`.\n   - Scope **read_write** is required to queue or cancel scans and to clear triage.\n   - Optionally restrict the token to specific scanner agents; every command then only\n     ever sees those scanners' hosts.\n3. In XSOAR, configure this integration with the PortTorch server URL (including the\n   port, e.g. `https://porttorch.internal:8443`) and that token.\n\n### Notes\n\n- PortTorch generates its **own self-signed TLS certificate** on first boot. Either\n  upload a real certificate under Settings -> TLS Certificate, add its CA to the\n  XSOAR engine's trust store, or tick *Trust any certificate*.\n- Leave *Use system proxy settings* off unless XSOAR genuinely reaches PortTorch\n  through a proxy - PortTorch is usually internal.\n- Tokens are **rate limited per token** (120 requests/minute by default). A throttled\n  call returns a clear error naming the retry delay rather than failing silently.\n- A host's identity in PortTorch is (IP, scanner agent), because two scanners in two\n  separate networks can each have a real device at the same private address. If a\n  lookup matches more than one, the command fails with the candidate list and you\n  re-run it with `scanner_agent` set.\n- `porttorch-triage-finding` currently works with a **read-only** token, unlike every\n  other writing command. That is PortTorch's own behaviour - `PUT /findings/triage` is\n  not behind its write-scope guard while `DELETE` on the same path is - and is stated\n  here because a read-only token is otherwise assumed to be unable to change anything.\n- There is no `fetch-incidents`. PortTorch pushes rather than being polled: configure a\n  webhook channel under Admin -> Webhooks pointing at XSOAR and subscribe to the events\n  that should raise an incident.\n"
