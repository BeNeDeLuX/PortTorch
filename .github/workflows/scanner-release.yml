name: Scanner Release

# Builds prebuilt scanner binaries (linux/amd64, linux/arm64 - the same two
# architectures install.sh's Go-toolchain bootstrap already supports) and
# publishes them as GitHub Release assets whenever a "scanner-vX.Y.Z" tag is
# pushed. install.sh downloads these instead of building from source when
# the checkout is exactly at a matching tag - see its "prebuilt-binary fast
# path" section.

on:
  push:
    tags:
      - "scanner-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing scanner-v* tag to (re-)build and (re-)publish"
        required: true

permissions:
  contents: write

defaults:
  run:
    working-directory: scanner

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          case "$TAG" in
            scanner-v*) ;;
            *) echo "tag '$TAG' doesn't match scanner-v*" >&2; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#scanner-v}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: scanner/go.mod
          cache-dependency-path: scanner/go.sum

      - name: gofmt check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      - name: Build release binaries
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build \
              -trimpath \
              -ldflags "-s -w -X porttorch/scanner/internal/version.Version=${{ steps.tag.outputs.version }}" \
              -o "dist/porttorch-linux-$arch" \
              ./cmd/scanner
          done
          (cd dist && sha256sum porttorch-linux-* > SHA256SUMS)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          REPO="${{ github.repository }}"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/porttorch-linux-amd64 dist/porttorch-linux-arm64 dist/SHA256SUMS \
              --repo "$REPO" --clobber
          else
            gh release create "$TAG" dist/porttorch-linux-amd64 dist/porttorch-linux-arm64 dist/SHA256SUMS \
              --repo "$REPO" --title "Scanner $TAG" --generate-notes
          fi
