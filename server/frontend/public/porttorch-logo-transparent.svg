    </filter>
  </defs>

  <g transform="translate(30,-6) scale(0.42)">
    <path d="M 120 410 A 150 150 0 0 1 392 410" fill="none" stroke="#2DE1C2" stroke-width="4" stroke-dasharray="8 12" opacity="0.45"/>

    <path d="
      M 256 58
      C 296 104 314 142 298 180
      C 336 162 360 200 348 246
      C 378 228 396 274 380 320
      C 400 356 384 402 340 424
      C 356 388 340 366 314 374
      C 328 404 302 434 256 436
      C 210 434 184 404 198 374
      C 172 366 156 388 172 424
      C 128 402 112 356 132 320
      C 116 274 134 228 164 246
      C 152 200 176 162 214 180
      C 198 142 216 104 256 58
      Z"
      fill="url(#flame2)"/>

    <rect x="196" y="330" width="120" height="86" rx="10" fill="#12151C"/>
    <rect x="234" y="316" width="44" height="18" rx="4" fill="#12151C"/>
    <rect x="212" y="352" width="8" height="46" rx="2" fill="#2DE1C2" filter="url(#glow2)"/>
    <rect x="230" y="352" width="8" height="46" rx="2" fill="#2DE1C2" filter="url(#glow2)"/>
    <rect x="248" y="352" width="8" height="46" rx="2" fill="#FF3B3B" filter="url(#glow2)"/>
    <rect x="266" y="352" width="8" height="46" rx="2" fill="#2DE1C2" filter="url(#glow2)"/>
    <rect x="284" y="352" width="8" height="46" rx="2" fill="#2DE1C2" filter="url(#glow2)"/>
