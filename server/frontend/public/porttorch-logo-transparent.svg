  <!-- "Port" with subtle black outline so it stays visible on white/light backgrounds -->
  <text x="240" y="150" font-family="'JetBrains Mono','Courier New',monospace" font-size="64" font-weight="700" letter-spacing="1"
        fill="#EDEBE6" stroke="#0D0F15" stroke-width="1.5" paint-order="stroke fill" stroke-linejoin="round">Port</text>
  <text x="400" y="150" font-family="'JetBrains Mono','Courier New',monospace" font-size="64" font-weight="700" letter-spacing="1" fill="#FF6B25">Torch</text>

  <text x="242" y="185" font-family="'JetBrains Mono','Courier New',monospace" font-size="18" letter-spacing="4" fill="#2DE1C2" opacity="0.8">SCAN · IDENTIFY · ILLUMINATE</text>
